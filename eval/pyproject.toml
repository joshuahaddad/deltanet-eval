[project]
name = "filing-recall"
version = "0.1.0"
description = "Exact vs tolerant recall on long SEC 10-K filings"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "instructor>=1.17.0",
    "lxml>=6.1.3",
    "mlflow>=3.18.0",
    "numpy>=2.0",
    "openai>=3.3.0",
    "pyarrow>=18",
    "python-multipart>=0.0.33",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]


[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
